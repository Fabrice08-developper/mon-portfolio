<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="projet.css"/>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"/>
    <title>Mon restaurant</title>
</head>
<body>
    <div class="container">
      <header class="titre">
            <div>
                <img src="image/télécharger (2).jpg" alt="mon restaurant"/>
            </div>
            <div>
                <h3><i class="fa-solid fa-phone"></i>&nbsp;appelez-nous:02/123.45.67</h3>
            </div>
     </header>
    <section class="carrousel">
     <div class="images"> 
        <img class="slider-item" src="télécharger (1).jpeg" width="700"/></br>
        <img class="slider-item" src="OIP (2).jpeg" width="700"/></br>
        <img class="slider-item" src="télécharger.jpeg" width="700"/>
     </div> 
      <div class="fleches">
                <span><i id="gauche" class="fa-solid fa-angle-left fa-2xl"></i></span>
                <span><i id="droite" class="fa-solid fa-angle-right fa-2xl"></i></span>
      </div> 
    </section>
      <nav>
            <div Id="toggle-btn">
                <i class="fa-solid fa-bars fa-xl"></i>
            </div>
            <ul id="ulref">
                <li>Entrees</li>
                <li><a href="Desserts.html">Desserts</a></li>
                <li><a href="Plats.html">Plats</a></li>
                <li><a href="projet.html">realisation</a></li>           
                <li><a href="Boissons.html">Boissons</a></li>
                <li><a href="Contact.html">Contact</a></li>
            </ul>
        </nav>  
     </div> 
     <script>
       // Menu Hamburger
        const btn = document.querySelector('#toggle-btn');
        const ul = document.getElementById('ulref');

        btn.onclick = ()=> ul.style.opacity == 0 ? ul.style.opacity = 1 : ul.style.opacity = 0;

        // carrousel
        const carrousel_content = document.querySelector('.images');
        const prev = document.getElementById('gauche');
        const next = document.getElementById('droite');
        let translate = 0;

        prev.onclick = ()=>{
            translate += 100;
            if(translate > 0)
                translate = 0
            carrousel_content.style.transform = 'translateX(' + translate +'%)';
        }
        next.onclick = ()=>{
            translate -= 100;
            if(translate < -200)
                translate = 0  
            carrousel_content.style.transform = 'translateX(' + translate +'%)';
        }

    </script>
  
</body>
</html>
